# Test properties for in-memory H2 DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.main.allow-bean-definition-overriding=true

# Ensure Hibernate creates schema before running data.sql (important for tests)
spring.jpa.defer-datasource-initialization=true

# Disable automatic execution of application-level data.sql during tests
spring.sql.init.mode=never

# Test-specific overrides
campaign.email.max.attempts=3