# ===================================================================
#  LEALTIX BACKEND - Perfil LOCAL (application-local.properties)
#  Este archivo se activa con el perfil 'local' (por defecto).
#  Toma las variables de entorno definidas en el archivo .env
#  o usa valores por defecto pensados para desarrollo local.
# ===================================================================

# --- Base de Datos PostgreSQL Local ---
# Permite definir DB_URL / DB_USER / DB_PASSWORD en .env o usar los valores locales por defecto
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lealtix_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection Pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway Migraciones ---
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:${FLYWAY_ENABLED:true}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.clean-disabled=true

# --- Servidor ---
server.port=${SERVER_PORT:8080}

# --- CORS (Permitir Frontends Locales) ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:4201}

# --- URLs de la Plataforma (Local) ---
invitation.token.expiry-hours=120
invitation.base-url=${INVITATION_BASE_URL:http://localhost:4200}
lealtix.backend.url=${LEALTIX_BACKEND_URL:http://localhost:8080}
lealtix.dashboard.url=${LEALTIX_DASHBOARD_URL:http://localhost:4201}

# --- Autenticacion / Seguridad Local ---
spring.security.user.name=${SPRING_SECURITY_USER_NAME:admin}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin}
spring.security.user.roles=ADMIN

# --- JWT ---
jwt.secret=${JWT_SECRET}

# --- Stripe ---
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# --- SendGrid Email ---
sendgrid.email.from=${SENDGRID_EMAIL_FROM:contacto@lealtix.com.mx}
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.templates.pre-registro=${SENDGRID_TEMPLATE_PRE_REGISTRO:d-0e139d9c47dd4880aadf77107842d763}
sendgrid.templates.welcome=${SENDGRID_TEMPLATE_WELCOME:d-7d6c460c905a48da80fafab71f47b8c5}
sendgrid.templates.welcome-customer=${SENDGRID_TEMPLATE_WELCOME_CUSTOMER:d-28bcc98d7fe14063b4d3bd2728ad5607}
sendgrid.templates.welcome-customer-no-coupon=${SENDGRID_TEMPLATE_WELCOME_CUSTOMER_NO_COUPON:d-e2a9a8d99eea46c08ae1798f65d6af2c}
sendgrid.templates.coupon-redemption=${SENDGRID_TEMPLATE_COUPON_REDEMPTION:d-4998166b1aed42919df0ef80e2e5fc87}
sendgrid.templates.generic-promotion=${SENDGRID_TEMPLATE_GENERIC_PROMOTION:d-52f1ea8db9f64338af8ca4f5530a3130}

# --- Cloudinary ---
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET}
cloudinary.url=${CLOUDINARY_URL}

# --- Campanas de Email ---
campaign.email.scheduler.interval=120000
campaign.email.batch.size=50
campaign.email.provider.name=sendgrid
campaign.email.max.attempts=2

# --- Logs de Desarrollo / Debug ---
logging.level.org.springframework.security=DEBUG
logging.level.com.lealtixservice.config.SecurityDebugFilter=DEBUG
