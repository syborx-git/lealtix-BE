# Application properties (dev/profile 'dev')
# Use UTF-8 encoding

# PostgreSQL Connection (Neon / Render / Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/lealtix_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) - Optimizado para bajo consumo de memoria y Neon free tier
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:8080}

# Flyway (Deshabilitado por defecto para BD nueva en Neon; Hibernate crea las tablas automáticamente con ddl-auto=update)
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.clean-disabled=true
# spring.flyway.locations=classpath:db/migration_clean  # optionally use a dev-only migrations folder

# Swagger Configuration
springdoc.swagger-ui.tagsSorter=alpha

# CORS Configuration (production/dev/Hetzner origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://5.161.82.24:3000,http://5.161.82.24:4201,http://5.161.82.24:8082,http://localhost:3000,http://localhost:4200,http://localhost:4201,https://admin.lealtix.com.mx,https://lealtix.com.mx,https://www.lealtix.com.mx}

# SENDGRID
sendgrid.email.from=contacto@lealtix.com.mx
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.templates.pre-registro=d-e0e88fddd3c04a9d9f398c11dfad52d6
sendgrid.templates.welcome=d-62aae4c51c994b9793a6b8821cbe9ce3
sendgrid.templates.welcome-customer=d-90d36fd8a5c14d52a156e28308a501b5
sendgrid.templates.welcome-customer-no-coupon=d-f8686ab0f9e04f4b82611bac3b682abb
sendgrid.templates.coupon-redemption=d-1f34cc810c1144648f109021de9fa3f1
sendgrid.templates.generic-promotion=d-65d9886628f247dca8221c0504667dcc

# Expiracion de token
invitation.token.expiry-hours=120
# Dominio base para links de invitacion / landing de clientes
invitation.base-url=${INVITATION_BASE_URL:https://lealtix.com.mx}
# Dominio BE
lealtix.backend.url=${LEALTIX_BACKEND_URL:https://api.lealtix.com.mx}
# Dominio Dashboard
lealtix.dashboard.url=${LEALTIX_DASHBOARD_URL:https://admin.lealtix.com.mx}

# Spring Security
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Stripe API
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# JWT
jwt.secret=${JWT_SECRET}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET}
cloudinary.url=${CLOUDINARY_URL}

# Campaign Email Configuration
campaign.email.scheduler.interval=1200000
campaign.email.batch.size=50
campaign.email.provider.name=sendgrid
campaign.email.max.attempts=2

# DEBUG logging for security troubleshooting
logging.level.org.springframework.security=DEBUG
logging.level.com.lealtixservice.config.SecurityDebugFilter=DEBUG