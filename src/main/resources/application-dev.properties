# Application properties (dev/profile 'dev')
# Use UTF-8 encoding

# PostgreSQL Connection (Render)
spring.datasource.url=jdbc:postgresql://dpg-d5et4n2li9vc73d6mbfg-a/lealtix_db_vmbz
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080

# Flyway dev helper: allow baselining when adopting Flyway on an existing DB. Only for non-prod/dev use.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.clean-disabled=true
# spring.flyway.locations=classpath:db/migration_clean  # optionally use a dev-only migrations folder

# Swagger Configuration
springdoc.swagger-ui.tagsSorter=alpha

# CORS Configuration (production/dev origins)
cors.allowed-origins=https://admin.lealtix.com.mx,https://lealtix.com.mx,https://www.lealtix.com.mx,https://lealtix-service.onrender.com

# SENDGRID
sendgrid.email.from=contacto@lealtix.com.mx
