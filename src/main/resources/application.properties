# Application properties (local)
# Use UTF-8 encoding

# Sirve el build de la landing (lealtix-main) desde el backend (mismo origen).
# Ajusta la ruta si tus repos no están como carpetas hermanas de lealtix-BE.
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:../lealtix-main/dist/lealtix_main/browser/

spring.datasource.url=jdbc:postgresql://localhost:5432/lealtix_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SSE: evita que el timeout async del contenedor corte las conexiones antes de tiempo
spring.mvc.async.request-timeout=7200000

# Hibernate Performance Tuning
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Connection Pool (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
# Clean disabled for safety (never enable in production)
spring.flyway.clean-disabled=true

server.port=8080

# Swagger Configuration
springdoc.swagger-ui.tagsSorter=alpha

# CORS Configuration (local development origins)
cors.allowed-origins=http://localhost:4200,http://localhost:4201

# SENDGRID
sendgrid.email.from=contacto@lealtix.com.mx
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.templates.pre-registro=d-e0e88fddd3c04a9d9f398c11dfad52d6
sendgrid.templates.welcome=d-62aae4c51c994b9793a6b8821cbe9ce3
sendgrid.templates.welcome-customer=d-90d36fd8a5c14d52a156e28308a501b5
sendgrid.templates.welcome-customer-no-coupon=d-f8686ab0f9e04f4b82611bac3b682abb
sendgrid.templates.coupon-redemption=d-1f34cc810c1144648f109021de9fa3f1
sendgrid.templates.generic-promotion=d-65d9886628f247dca8221c0504667dcc

# Expiracion de token
invitation.token.expiry-hours=120
# Dominio base para links de invitacion
invitation.base-url=http://localhost:4200
# Dominio BE
lealtix.backend.url=http://localhost:8080
# Dominio Dashboard
lealtix.dashboard.url=http://localhost:4201

# Spring Security (default dev user)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN

# Stripe API
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# JWT
jwt.secret=${JWT_SECRET}

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET}
cloudinary.url=${CLOUDINARY_URL}

# Campaign Email Configuration
campaign.email.scheduler.interval=120000
campaign.email.batch.size=50
campaign.email.provider.name=sendgrid
campaign.email.max.attempts=2

# DEBUG logging for security troubleshooting
logging.level.org.springframework.security=DEBUG
logging.level.com.lealtixservice.config.SecurityDebugFilter=DEBUG

# Default profile
spring.profiles.default=local