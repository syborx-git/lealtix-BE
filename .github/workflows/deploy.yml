name: CI/CD Backend Hetzner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: hetzner-deploy-be
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. CI: Validación en Pull Requests y Pushes
  # -------------------------------------------------------------
  build-and-test:
    name: Validar Compilación Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar y validar sintaxis Java
        run: mvn clean test-compile -DskipTests

  # -------------------------------------------------------------
  # 2. CD: Despliegue en Hetzner (Sólo al fusionar o empujar a 'main')
  # -------------------------------------------------------------
  deploy:
    name: Desplegar en Hetzner (Main)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [BE] Desplegando Backend desde rama main..."

            REPO_DIR="/var/www/lealtix/lealtix-BE"
            if [ ! -d "$REPO_DIR" ]; then
              REPO_DIR="/var/www/lealtix/lealtix-be"
            fi
            if [ ! -d "$REPO_DIR" ]; then
              REPO_DIR="$(find /home /root /opt /srv /app /var /usr/local -maxdepth 8 -type d -iname 'lealtix-be' 2>/dev/null | head -n 1)"
            fi
            if [ -z "$REPO_DIR" ] || [ ! -d "$REPO_DIR" ]; then
              echo "❌ No se encontró el repo lealtix-BE en el servidor"; exit 1
            fi
            echo "REPO_DIR=$REPO_DIR"
            cd "$REPO_DIR"

            # Forzar sincronización exacta con origin/main
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            echo "HEAD del Backend: $(git rev-parse --short HEAD)"

            COMPOSE_DIR="$(dirname "$REPO_DIR")"
            if [ ! -f "$COMPOSE_DIR/docker-compose.yml" ]; then
              COMPOSE_FILE="$(grep -rl 'lealtix-backend' /var/www /root /home /opt /srv /app --include='docker-compose.yml' 2>/dev/null | head -n 1)"
              if [ -n "$COMPOSE_FILE" ]; then COMPOSE_DIR="$(dirname "$COMPOSE_FILE")"; fi
            fi
            cd "$COMPOSE_DIR"

            echo "===== Reconstruyendo contenedor lealtix-backend ====="
            docker compose build --no-cache lealtix-backend
            docker compose up -d --force-recreate --no-deps lealtix-backend

            echo "===== Monitoreo y logs iniciales ====="
            sleep 15
            docker compose ps
            docker compose logs --tail=50 lealtix-backend || true

            echo "===== Healthcheck de la API ====="
            for i in $(seq 1 25); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/api/tenant/slug/demo || curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/tenant/slug/demo || echo 000)
              echo "Intento $i: HTTP $code"
              if [ "$code" = "200" ]; then
                echo "✅ Backend respondiendo con éxito (HTTP 200)!"
                break
              fi
              if [ "$i" = "25" ]; then
                echo "❌ La API no respondió 200 tras el despliegue."
                docker compose logs --tail=100 lealtix-backend
                exit 1
              fi
              sleep 4
            done
            echo "🎉 Backend desplegado y activo!"
