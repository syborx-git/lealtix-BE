name: Deploy Backend to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            BRANCH="${{ github.ref_name }}"
            echo "🚀 Desplegando Backend desde rama $BRANCH..."
            cd /var/www/lealtix/lealtix-BE
            # Forzar que el servidor quede EXACTAMENTE en origin/$BRANCH (evita drift)
            git fetch origin "$BRANCH"
            git checkout -f "$BRANCH"
            git reset --hard "origin/$BRANCH"
            echo "HEAD del servidor: $(git rev-parse --short HEAD)"
            cd /var/www/lealtix
            # Variables de entorno de integraciones (Facturapi / Stripe webhook)
            export FACTURAPI_API_KEY="sk_test_1EWd1bt2DZRjnAjDnRFJVxnwUxdoyxWUZVtaPm1TqF"
            export STRIPE_WEBHOOK_SECRET="whsec_KzGucdB6wfFN8Y14k7Gl7vxeSwv58o4S"
            ENV_FILE=/var/www/lealtix/.env
            touch "$ENV_FILE"
            grep -q '^FACTURAPI_API_KEY=' "$ENV_FILE" \
              && sed -i 's|^FACTURAPI_API_KEY=.*|FACTURAPI_API_KEY=sk_test_1EWd1bt2DZRjnAjDnRFJVxnwUxdoyxWUZVtaPm1TqF|' "$ENV_FILE" \
              || echo 'FACTURAPI_API_KEY=sk_test_1EWd1bt2DZRjnAjDnRFJVxnwUxdoyxWUZVtaPm1TqF' >> "$ENV_FILE"
            grep -q '^STRIPE_WEBHOOK_SECRET=' "$ENV_FILE" \
              && sed -i 's|^STRIPE_WEBHOOK_SECRET=.*|STRIPE_WEBHOOK_SECRET=whsec_KzGucdB6wfFN8Y14k7Gl7vxeSwv58o4S|' "$ENV_FILE" \
              || echo 'STRIPE_WEBHOOK_SECRET=whsec_KzGucdB6wfFN8Y14k7Gl7vxeSwv58o4S' >> "$ENV_FILE"
            # CORS: permitir el panel de produccion y desarrollo
            CORS_ORIGINS="https://admin.lealtix.com.mx,https://lealtix.com.mx,https://www.lealtix.com.mx,http://localhost:4200,http://localhost:4201,http://localhost:3000"
            grep -q '^CORS_ALLOWED_ORIGINS=' "$ENV_FILE" \
              && sed -i "s|^CORS_ALLOWED_ORIGINS=.*|CORS_ALLOWED_ORIGINS=$CORS_ORIGINS|" "$ENV_FILE" \
              || echo "CORS_ALLOWED_ORIGINS=$CORS_ORIGINS" >> "$ENV_FILE"
            # Override para garantizar las variables en el contenedor
            cat > /var/www/lealtix/docker-compose.override.yml <<'YML'
            services:
              lealtix-backend:
                environment:
                  FACTURAPI_API_KEY: "sk_test_1EWd1bt2DZRjnAjDnRFJVxnwUxdoyxWUZVtaPm1TqF"
                  STRIPE_WEBHOOK_SECRET: "whsec_KzGucdB6wfFN8Y14k7Gl7vxeSwv58o4S"
                  CORS_ALLOWED_ORIGINS: "https://admin.lealtix.com.mx,https://lealtix.com.mx,https://www.lealtix.com.mx,http://localhost:4200,http://localhost:4201,http://localhost:3000"
            YML
            # Build separado: si falla la compilacion, el workflow FALLA (set -e) y se ve
            echo "===== build lealtix-backend ====="
            docker compose build lealtix-backend
            docker compose up -d --force-recreate lealtix-backend
            sleep 15
            echo "===== docker compose ps ====="
            docker compose ps || true
            echo "===== docker compose logs lealtix-backend ====="
            docker compose logs --tail=300 lealtix-backend || true
            echo "===== health check API ====="
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/api/tenant/slug/demo || echo 000)
              echo "intento $i: $code"
              if [ "$code" = "200" ]; then break; fi
              if [ "$i" = "20" ]; then echo "❌ La API no respondió 200 tras el deploy"; exit 1; fi
              sleep 5
            done
            echo "✅ Backend actualizado con éxito!"
