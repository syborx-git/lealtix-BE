name: CI/CD Backend Hetzner

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: hetzner-deploy-be
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # 1. CI: Validación en Pull Requests y Pushes
  # -------------------------------------------------------------
  build-and-test:
    name: Validar Compilación Backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compilar y validar sintaxis Java
        run: mvn clean test-compile -DskipTests

  # -------------------------------------------------------------
  # 2. CD: Despliegue en Hetzner (Sólo al fusionar o empujar a 'main')
  # -------------------------------------------------------------
  deploy:
    name: Desplegar en Hetzner (Main)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "🚀 [BE] Desplegando Backend desde rama main..."
            echo "=== Diagnostico del Servidor ==="
            echo "Contenedores activos:"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true

            echo "Contenido de /var/www:"
            ls -la /var/www || true

            echo "Contenido de /var/www/lealtix:"
            ls -la /var/www/lealtix 2>/dev/null || true

            # 1. Buscar repo del backend por pom.xml o nombres comunes
            REPO_DIR=""
            for candidate in \
              "/var/www/lealtix/lealtix-BE" \
              "/var/www/lealtix/lealtix-be" \
              "/var/www/lealtix/lealtix-backend" \
              "/var/www/lealtix/backend" \
              "/var/www/lealtix/lealtix_service" \
              "/var/www/lealtix-BE" \
              "/var/www/lealtix-be" \
              "/var/www/lealtix-backend"
            do
              if [ -d "$candidate/.git" ] || [ -f "$candidate/pom.xml" ]; then
                REPO_DIR="$candidate"
                echo "Encontrado candidato: $REPO_DIR"
                break
              fi
            done

            # 2. Si no se encontro en candidatos, buscar por pom.xml
            if [ -z "$REPO_DIR" ] || [ ! -d "$REPO_DIR" ]; then
              echo "Buscando pom.xml en el servidor..."
              POM_PATH="$(find /var/www /root /home /opt /srv /app -maxdepth 6 -name 'pom.xml' 2>/dev/null | head -n 1)"
              if [ -n "$POM_PATH" ]; then
                REPO_DIR="$(dirname "$POM_PATH")"
                echo "Encontrado por pom.xml: $REPO_DIR"
              fi
            fi

            # 3. Si no existe, clonar el repositorio
            if [ -z "$REPO_DIR" ] || [ ! -d "$REPO_DIR" ]; then
              echo "⚠️ No se encontro repo backend existente en el servidor. Clonando..."
              mkdir -p /var/www/lealtix
              cd /var/www/lealtix
              git clone https://github.com/syborx-git/lealtix-BE.git lealtix-BE
              REPO_DIR="/var/www/lealtix/lealtix-BE"
            fi

            echo "REPO_DIR final = $REPO_DIR"
            cd "$REPO_DIR"

            set -e

            # Sincronizar codigo con origin/main
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            echo "HEAD del Backend: $(git rev-parse --short HEAD)"

            # Localizar docker-compose.yml
            COMPOSE_DIR="$(dirname "$REPO_DIR")"
            if [ ! -f "$COMPOSE_DIR/docker-compose.yml" ]; then
              COMPOSE_FILE="$(grep -rl 'lealtix-backend' /var/www /root /home /opt /srv /app --include='docker-compose.yml' 2>/dev/null | head -n 1)"
              if [ -n "$COMPOSE_FILE" ]; then COMPOSE_DIR="$(dirname "$COMPOSE_FILE")"; fi
            fi

            if [ ! -f "$COMPOSE_DIR/docker-compose.yml" ]; then
              COMPOSE_FILE="$(find /var/www /root /home -maxdepth 4 -name 'docker-compose.yml' 2>/dev/null | head -n 1)"
              if [ -n "$COMPOSE_FILE" ]; then COMPOSE_DIR="$(dirname "$COMPOSE_FILE")"; fi
            fi

            echo "COMPOSE_DIR final = $COMPOSE_DIR"
            cd "$COMPOSE_DIR"

            echo "===== Reconstruyendo contenedor lealtix-backend ====="
            docker compose build --no-cache lealtix-backend || docker compose build lealtix-backend
            docker compose up -d --force-recreate --no-deps lealtix-backend

            echo "===== Monitoreo y logs iniciales ====="
            sleep 15
            docker compose ps
            docker compose logs --tail=50 lealtix-backend || true

            echo "===== Healthcheck de la API ====="
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8082/api/tenant/slug/demo || curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/tenant/slug/demo || echo 000)
              echo "Intento $i: HTTP $code"
              if [ "$code" = "200" ]; then
                echo "✅ Backend respondiendo con éxito (HTTP 200)!"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "❌ La API no respondió 200 tras el despliegue."
                docker compose logs --tail=100 lealtix-backend
                exit 1
              fi
              sleep 4
            done
            echo "🎉 Backend desplegado y activo!"
